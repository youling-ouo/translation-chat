<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>兩岸用語翻譯與匿名聊天系統</title>
    <style>
        :root {
            --bg-color: #36393f;
            --panel-bg: #2f3136;
            --text-color: #dcddde;
            --primary: #5865F2;
            --primary-hover: #4752c4;
            --border-radius: 8px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            height: 100vh;
        }

        /* 側邊欄設計 */
        .sidebar {
            width: 250px;
            background-color: #202225;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #fff;
            text-align: center;
        }

        .tab-btn {
            background-color: transparent;
            color: var(--text-color);
            border: none;
            padding: 12px;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 16px;
            text-align: left;
            transition: 0.2s;
        }

        .tab-btn:hover {
            background-color: #393c43;
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: #fff;
        }

        /* 主內容區 */
        .main-content {
            flex: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .section {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .section.active {
            display: flex;
        }

        /* 輸入與輸出區域 */
        textarea {
            width: 100%;
            background-color: #40444b;
            border: none;
            color: #fff;
            padding: 15px;
            border-radius: var(--border-radius);
            resize: none;
            font-size: 16px;
            box-sizing: border-box;
        }

        textarea:focus {
            outline: 2px solid var(--primary);
        }

        .translator-area {
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: 100%;
        }

        .output-box {
            flex: 1;
            background-color: var(--panel-bg);
            padding: 20px;
            border-radius: var(--border-radius);
            overflow-y: auto;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        /* 聊天室專用 */
        #chat-history {
            flex: 1;
            background-color: var(--panel-bg);
            border-radius: var(--border-radius);
            padding: 20px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        /* 回報功能 */
        .report-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .report-row input {
            flex: 1;
            padding: 12px;
            background-color: #40444b;
            border: none;
            color: #fff;
            border-radius: var(--border-radius);
            font-size: 16px;
        }

        .action-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
            transition: 0.2s;
        }

        .action-btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-add {
            background-color: #3ba55c;
            width: fit-content;
        }
        .btn-add:hover {
            background-color: #2d7d46;
        }
        
        .hint {
            font-size: 12px;
            color: #8e9297;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <!-- 側邊欄選單 -->
    <div class="sidebar">
        <h2>系統介面</h2>
        <button class="tab-btn active" onclick="switchTab('translator')">📝 文章翻譯器</button>
        <button class="tab-btn" onclick="switchTab('chat')">💬 匿名聊天室</button>
        <button class="tab-btn" onclick="switchTab('report')">➕ 詞彙回報</button>
    </div>

    <!-- 主內容區 -->
    <div class="main-content">
        
        <!-- 文章翻譯器 -->
        <div id="section-translator" class="section active">
            <div class="translator-area">
                <div class="output-box" id="trans-output">翻譯結果將顯示在此處...</div>
                <div>
                    <textarea id="trans-input" rows="4" placeholder="請輸入文章..."></textarea>
                    <div class="hint">💡 提示：按下 Enter 送出翻譯，按下 Shift + Enter 換行</div>
                </div>
            </div>
        </div>

        <!-- 匿名聊天室 -->
        <div id="section-chat" class="section">
            <div id="chat-history"></div>
            <div>
                <textarea id="chat-input" rows="3" placeholder="請輸入訊息..."></textarea>
                <div class="hint">💡 提示：按下 Enter 送出訊息，按下 Shift + Enter 換行</div>
            </div>
        </div>

        <!-- 詞彙回報功能 -->
        <div id="section-report" class="section">
            <h3 style="margin-top: 0;">大量回報新詞彙</h3>
            <div id="report-container">
                <div class="report-row">
                    <input type="text" placeholder="詞彙 A (例: 視頻)" class="word-a">
                    <input type="text" placeholder="詞彙 B (例: 影片)" class="word-b">
                </div>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="action-btn btn-add" onclick="addReportRow()">+ 新增一列</button>
                <button class="action-btn" onclick="submitReport()">📥 送出回報</button>
            </div>
        </div>

    </div>

    <script>
        // 核心邏輯：動態詞庫
        let basePairs = [
            ["屏幕", "螢幕"], ["視頻", "影片"], ["硬件", "硬體"], ["軟件", "軟體"],
            ["內存", "記憶體"], ["程序員", "工程師"], ["公交車", "公車"], 
            ["土豆", "馬鈴薯"], ["方便麵", "泡麵"], ["早上好", "早安"], ["三文魚", "鮭魚"]
        ];

        let dictionary = {};

        // 重建雙向字典
        function buildDictionary() {
            dictionary = {};
            basePairs.forEach(pair => {
                if(pair[0] && pair[1]) {
                    dictionary[pair[0]] = pair[1];
                    dictionary[pair[1]] = pair[0]; // 雙向綁定！
                }
            });
        }
        buildDictionary();

        // 翻譯核心演算法 (解決雙向衝突問題)
        function translateText(text) {
            if (!text) return "";
            // 將詞彙依長度由長到短排序，避免部分匹配錯誤
            const keys = Object.keys(dictionary).sort((a, b) => b.length - a.length);
            // 建立正規表達式，一次性配對並替換
            const regex = new RegExp(keys.join("|"), "g");
            return text.replace(regex, matched => dictionary[matched]);
        }

        // --- 介面控制邏輯 ---

        // 切換分頁
        function switchTab(tabId) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById('section-' + tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // 處理 Textarea 的 Enter 與 Shift+Enter 事件
        function handleKeydown(e, submitCallback) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault(); // 阻止預設換行
                submitCallback();
            }
        }

        // 文章翻譯器送出
        const transInput = document.getElementById('trans-input');
        transInput.addEventListener('keydown', (e) => handleKeydown(e, () => {
            const text = transInput.value;
            if(!text.trim()) return;
            document.getElementById('trans-output').innerText = translateText(text);
            transInput.value = ''; // 清空輸入框
        }));

        // 聊天室送出
        const chatInput = document.getElementById('chat-input');
        chatInput.addEventListener('keydown', (e) => handleKeydown(e, () => {
            const text = chatInput.value;
            if(!text.trim()) return;
            const translatedText = translateText(text);
            
            const chatHistory = document.getElementById('chat-history');
            const msgDiv = document.createElement('div');
            msgDiv.style.marginBottom = "10px";
            msgDiv.innerHTML = `<b>匿名：</b> ${translatedText}`;
            chatHistory.appendChild(msgDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight; // 自動捲動到底部
            
            chatInput.value = '';
        }));

        // 回報功能：新增列
        function addReportRow() {
            const container = document.getElementById('report-container');
            const row = document.createElement('div');
            row.className = 'report-row';
            row.innerHTML = `
                <input type="text" placeholder="詞彙 A" class="word-a">
                <input type="text" placeholder="詞彙 B" class="word-b">
            `;
            container.appendChild(row);
        }

        // 回報功能：送出
        function submitReport() {
            const rows = document.querySelectorAll('.report-row');
            let addedCount = 0;

            rows.forEach(row => {
                const wordA = row.querySelector('.word-a').value.trim();
                const wordB = row.querySelector('.word-b').value.trim();
                
                if (wordA && wordB) {
                    basePairs.push([wordA, wordB]);
                    addedCount++;
                }
            });

            if (addedCount > 0) {
                buildDictionary(); // 重新整理雙向字典
                alert(`成功新增 ${addedCount} 組詞彙！`);
                // 清空重置
                document.getElementById('report-container').innerHTML = `
                    <div class="report-row">
                        <input type="text" placeholder="詞彙 A (例: 視頻)" class="word-a">
                        <input type="text" placeholder="詞彙 B (例: 影片)" class="word-b">
                    </div>`;
            } else {
                alert("請至少完整填寫一組詞彙喔！");
            }
        }
    </script>
</body>
</html>
